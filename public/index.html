<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI Helper">
  <title>AI Helper</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e8eaf0; --muted: #8a92a6;
      --me: #2f6df6; --me-text: #fff; --bot: #1d212b; --err: #3a1d22; --err-text: #ffb4bd;
      --accent: #2f6df6; --ok: #34c759; --off: #ff6b6b;
      --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
    button, input, textarea, select { font: inherit; color: inherit; }
    .hidden { display: none !important; }

    /* login */
    #login { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
    .card { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
    .card h1 { margin: 0 0 4px; font-size: 22px; }
    .card p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
    .card input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); outline: none; }
    .card input:focus { border-color: var(--accent); }
    .card button { width: 100%; margin-top: 12px; padding: 12px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; }
    #loginErr { color: var(--err-text); font-size: 14px; min-height: 20px; margin-top: 10px; }

    /* chat */
    #chat { height: 100%; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 10px; padding: calc(10px + var(--safe-t)) 12px 10px;
      border-bottom: 1px solid var(--line); background: var(--panel); }
    .title { font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); }
    .dot.on { background: var(--ok); }
    .status { color: var(--muted); font-size: 12px; }
    .spacer { flex: 1; }
    .seg { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
    .seg button { border: 0; background: none; padding: 5px 10px; border-radius: 999px; font-size: 13px; color: var(--muted); }
    .seg button.active { background: var(--accent); color: #fff; }
    .icon-btn { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 6px 10px; font-size: 13px; }
    .toolbar { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }

    #log { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
    .empty { margin: auto; text-align: center; color: var(--muted); max-width: 300px; font-size: 14px; }
    .empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
    .msg { max-width: 86%; padding: 10px 13px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .msg.user { align-self: flex-end; background: var(--me); color: var(--me-text); border-bottom-right-radius: 5px; }
    .msg.assistant { align-self: flex-start; background: var(--bot); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
    .msg.error { align-self: flex-start; background: var(--err); color: var(--err-text); }
    .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .msg.user .meta { color: rgba(255,255,255,.75); text-align: right; }
    .typing { align-self: flex-start; color: var(--muted); font-size: 14px; padding: 4px 6px; }

    #approvals { padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; max-height: 55vh; overflow-y: auto;
      background: #2a2210; border-bottom: 1px solid #5c4a1a; }
    .appr { background: var(--panel); border: 1px solid #8a6d1f; border-radius: 14px; padding: 12px; }
    .appr h3 { margin: 0 0 6px; font-size: 15px; color: #ffd27a; }
    .appr pre { margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace;
      background: var(--bg); border-radius: 8px; padding: 8px; max-height: 220px; overflow: auto; }
    .appr .cmd { color: var(--muted); font-size: 12px; }
    .appr .row { display: flex; gap: 8px; }
    .appr button { flex: 1; padding: 10px; border-radius: 10px; border: 0; font-weight: 700; }
    .appr .yes { background: var(--ok); color: #062b10; }
    .appr .no { background: #3a1d22; color: var(--err-text); border: 1px solid #6b2b35; }
    form#composer { display: flex; gap: 8px; padding: 10px 12px calc(10px + var(--safe-b)); border-top: 1px solid var(--line); background: var(--panel); }
    #input { flex: 1; resize: none; max-height: 140px; padding: 10px 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg); outline: none; }
    #input:focus { border-color: var(--accent); }
    #sendBtn { border: 0; background: var(--accent); color: #fff; border-radius: 50%; width: 42px; height: 42px; flex: none; font-size: 18px; }
    #sendBtn:disabled { opacity: .5; }
  </style>
</head>
<body>
  <section id="login" class="hidden">
    <form class="card" id="loginForm">
      <h1>AI Helper</h1>
      <p>Private — enter your password.</p>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
      <button type="submit">Log in</button>
      <div id="loginErr" role="alert"></div>
    </form>
  </section>

  <section id="chat" class="hidden">
    <header>
      <div>
        <div class="title"><span class="dot" id="dot"></span>AI Helper</div>
        <div class="status" id="status">Checking PC…</div>
      </div>
      <div class="spacer"></div>
      <button type="button" class="icon-btn" id="newBtn" title="New chat">New chat</button>
    </header>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Which bot" id="targetSeg">
        <button type="button" data-target="cloud" class="active">☁️ Cloud</button>
        <button type="button" data-target="pc">💻 PC</button>
      </div>
      <div class="seg" role="group" aria-label="Model" id="modelSeg">
        <button type="button" data-model="free" class="active">Free</button>
        <button type="button" data-model="chatgpt">ChatGPT</button>
      </div>
    </div>
    <section id="approvals" class="hidden" aria-live="assertive"></section>
    <main id="log" aria-live="polite"></main>
    <form id="composer">
      <textarea id="input" rows="1" placeholder="Message your bot…" maxlength="8000"></textarea>
      <button id="sendBtn" type="submit" aria-label="Send">↑</button>
    </form>
  </section>

  <script src="/app.js"></script>
</body>
</html>
